[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wizelens"
version = "0.1.0a1"
description = "WizeLens for Python: OpenTelemetry auto-instrumentation with WizeLens defaults, plus SQL parameters, request bodies, and logs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "WizeWorks LLC", email = "hello@wizelens.com" }]
requires-python = ">=3.10"
keywords = ["wizelens", "opentelemetry", "otlp", "tracing", "apm", "profiler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-instrumentation>=0.51b0",
]

[project.optional-dependencies]
test = ["pytest>=8", "starlette>=0.40", "httpx>=0.27", "flask>=3", "sqlalchemy>=2,<2.1", "opentelemetry-instrumentation-dbapi>=0.51b0", "opentelemetry-instrumentation-sqlalchemy>=0.51b0", "opentelemetry-instrumentation-asgi>=0.51b0", "opentelemetry-instrumentation-flask>=0.51b0"]

[project.urls]
Homepage = "https://wizelens.com/docs/python/"
Source = "https://github.com/brandonkorous/wizelens/tree/main/python"
Issues = "https://github.com/brandonkorous/wizelens/issues"

[project.entry-points.opentelemetry_distro]
wizelens = "wizelens.distro:WizeLensDistro"

[project.entry-points.opentelemetry_configurator]
wizelens = "wizelens.distro:WizeLensConfigurator"

[tool.hatch.build.targets.wheel]
packages = ["src/wizelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
