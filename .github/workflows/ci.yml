name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Size rules (250 lines per file, 50 per function, one-line comments)
        run: pnpm check:size

      - name: Build JS packages and the dashboard
        run: pnpm build

      - name: Build the marketing site (static export)
        run: pnpm build:site

      - name: Check the marketing site (titles, descriptions, canonical links, share images, structured data, sitemap)
        run: pnpm --filter wizelens-site check:seo

      - name: Start ClickHouse (cloud scale-mode tests, Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker run -d --name clickhouse -p 8123:8123 -e CLICKHOUSE_USER=wizelens -e CLICKHOUSE_PASSWORD=ci \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 --ulimit nofile=262144:262144 clickhouse/clickhouse-server:26.8.30.8
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8123/ping && break; sleep 1; done

      - name: Test JS packages
        run: pnpm test
        env:
          # The ClickHouse store's parity tests run where the server above runs; elsewhere they are skipped.
          WIZELENS_TEST_CLICKHOUSE: ${{ matrix.os == 'ubuntu-latest' && 'http://wizelens:ci@127.0.0.1:8123' || '' }}

      - name: Build .NET (embeds the dashboard)
        run: dotnet build dotnet/WizeLens.slnx -c Release

      - name: Test .NET
        run: dotnet test dotnet/WizeLens.slnx -c Release --no-build

      - name: Pack (trial run)
        shell: bash
        run: |
          dotnet pack dotnet/WizeLens.slnx -c Release --no-build -o artifacts/nuget
          pnpm -r --filter "./js/packages/*" exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/

  hub-image:
    name: Hub Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f js/packages/hub/Dockerfile -t wizelens-hub:ci .

      - name: Start it and check the health, dashboard, and OTLP endpoints
        run: |
          docker run -d --name hub -p 5960:5960 wizelens-hub:ci
          for i in $(seq 1 30); do curl -sf http://localhost:5960/healthz && break; sleep 1; done
          curl -sf http://localhost:5960/_wizelens/ | grep -q "<title>WizeLens"
          curl -sf -X POST -H "Content-Type: application/json" -d '{"resourceSpans":[]}' http://localhost:5960/v1/traces
          curl -sf http://localhost:5960/_wizelens/api/info | grep -q '"mode":"hub"'

  inject-image:
    name: No-code install (Kubernetes webhook and image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Webhook tests
        run: node --test "deploy/inject/webhook/*.test.mjs"

      - name: Lint and render the Helm chart
        run: |
          helm lint deploy/inject/chart --set hub=http://wizelens-hub.wizelens:5960
          helm template wl deploy/inject/chart --namespace wizelens --set namespaceLabels.team=shop > /dev/null

      - name: Build the image
        run: docker build -f deploy/inject/Dockerfile -t wizelens-inject:ci .

      - name: The image holds both hooks, and the Node one traces a server
        run: |
          docker run --rm --entrypoint ls wizelens-inject:ci /wizelens/node/dist/auto.js /wizelens/dotnet/WizeLens.AutoInstrumentation.dll /wizelens/dotnet/WizeLens.AspNetCore.dll
          docker run --rm --entrypoint node -e NODE_ENV=development -e WIZELENS_DASHBOARD=false wizelens-inject:ci \
            --import /wizelens/node/dist/auto.js /app/selftest.mjs

      - name: The webhook answers a review with a patch
        run: |
          docker run -d --name inject -p 8443:8443 wizelens-inject:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8443/healthz && break; sleep 1; done
          curl -sf -X POST -H "Content-Type: application/json" http://localhost:8443/mutate \
            -d '{"request":{"uid":"ci","namespace":"shop","object":{"metadata":{"labels":{"wizelens.dev/inject":"node"}},"spec":{"containers":[{"name":"app","image":"app"}]}}}}' \
            | grep -q '"patchType":"JSONPatch"'

      - uses: helm/kind-action@v1
        with:
          cluster_name: wizelens

      - name: In a cluster, labeled pods of both samples are injected and traced
        run: bash deploy/inject/test/kind.sh wizelens

  cloud-postgres:
    name: Cloud on Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the cloud image
        run: docker build -f js/packages/cloud/Dockerfile -t wizelens-cloud:ci .

      - name: Start it with Postgres and run the end-to-end checks
        env:
          WIZELENS_CLOUD_IMAGE: wizelens-cloud:ci
        run: |
          export POSTGRES_PASSWORD="ci-$(openssl rand -hex 12)"
          export WIZELENS_CLOUD_AUTH_SECRET="$(openssl rand -base64 32)"
          export WIZELENS_CLOUD_SETUP_TOKEN="ci-$(openssl rand -hex 12)"
          export WIZELENS_CLOUD_CHECK_PWNED=0
          docker compose -p wlci -f deploy/docker-compose.cloud.yml up -d
          for i in $(seq 1 60); do curl -sf http://localhost:5970/healthz && break; sleep 2; done
          node scripts/cloud-smoke.mjs http://localhost:5970
          docker compose -p wlci -f deploy/docker-compose.cloud.yml down -v

  python:
    name: Python SDK (${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e "python[test]" build

      - name: Test
        run: pytest python

      - name: Build the package (trial run)
        run: python -m build python --outdir artifacts/pypi

      - name: Check the FastAPI sample
        run: python -m py_compile samples/python-fastapi/app.py samples/python-fastapi/store.py

  java:
    name: Java SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn -B -f java/pom.xml install

      - name: Build the Spring sample
        run: mvn -B -f samples/java-spring/pom.xml package -DskipTests

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            samples/go-net-http/go.sum

      - name: Vet and test
        working-directory: go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

      - name: Build the net/http sample
        working-directory: samples/go-net-http
        run: go vet ./... && go build ./...
