name: Release Go

# Push a tag like go/v0.1.0 to release the Go module github.com/wizeworksllc/wizelens/go. A Go module is published by its
# tag alone; this checks the tagged code and asks the Go module proxy (and so pkg.go.dev) to fetch it. No credentials.
on:
  push:
    tags: ["go/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Check the tag is a semantic version
        run: |
          VERSION="${GITHUB_REF_NAME#go/}"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "go/$VERSION is not go/vMAJOR.MINOR.PATCH"; exit 1; }
          [[ "$VERSION" == v0.* || "$VERSION" == v1.* ]] || { echo "v2 and later need a /v2 module path"; exit 1; }

      - name: go.mod and go.sum are tidy
        working-directory: go
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format, vet, and test
        working-directory: go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

      - name: Ask the Go module proxy to fetch the release
        run: |
          VERSION="${GITHUB_REF_NAME#go/}"
          for i in 1 2 3 4 5; do
            GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "github.com/wizeworksllc/wizelens/go@$VERSION" && exit 0
            sleep 20
          done
          echo "The proxy did not return $VERSION yet; it will on the first go get." && exit 1

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
