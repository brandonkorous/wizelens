name: Release

# Push a tag like v0.2.0 to publish every package and the hub and cloud images. Needs the NPM_TOKEN and NUGET_API_KEY repository secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install, check, build, test
        run: |
          pnpm install --frozen-lockfile
          pnpm check:size
          pnpm build
          pnpm test
          dotnet build dotnet/WizeLens.slnx -c Release
          dotnet test dotnet/WizeLens.slnx -c Release --no-build

      - name: Check the tag matches the package versions
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Pack
        run: |
          dotnet pack dotnet/WizeLens.slnx -c Release --no-build -o artifacts/nuget
          pnpm -r --filter "./js/packages/*" exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"

      - name: Publish to npm
        run: pnpm -r --filter "./js/packages/*" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/nuget/*.nupkg
            artifacts/npm/*.tgz
          generate_release_notes: true

  hub-image:
    name: Publish the hub and cloud images
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the hub and cloud images to ghcr.io/brandonkorous
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for NAME in hub cloud; do
            IMAGE="ghcr.io/brandonkorous/wizelens-$NAME"
            docker build -f "js/packages/$NAME/Dockerfile" -t "$IMAGE:$VERSION" .
            docker push "$IMAGE:$VERSION"
            if [[ "$VERSION" != *-* ]]; then docker tag "$IMAGE:$VERSION" "$IMAGE:latest" && docker push "$IMAGE:latest"; fi
          done
