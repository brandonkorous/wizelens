name: Release

# Push a tag like v0.2.0 to publish every npm and NuGet package and the hub and cloud images. npm and NuGet both use trusted publishing (GitHub OIDC), so no publish key is stored.
# The Java, Python, and Go SDKs have their own tags (java/v*, python/v*, go/v*) and workflows; see docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # npm and NuGet trusted publishing trade this job's OIDC token for a short-lived publish credential.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-dotnet@v4
        with:
          # .NET 8 runs the net8.0 build of every package in the tests.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install, check, build, test
        run: |
          pnpm install --frozen-lockfile
          pnpm check:size
          pnpm build
          pnpm test
          dotnet build dotnet/WizeLens.slnx -c Release
          dotnet test dotnet/WizeLens.slnx -c Release --no-build

      - name: Check the tag matches the package versions
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Pack
        run: |
          dotnet pack dotnet/WizeLens.slnx -c Release --no-build -o artifacts/nuget
          pnpm -r --filter "./js/packages/*" exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"

      # The .NET startup hook folder for DOTNET_STARTUP_HOOKS, for machines that do not pull the inject image.
      - name: Zip the .NET startup hook
        run: |
          dotnet publish dotnet/src/WizeLens.AutoInstrumentation/WizeLens.AutoInstrumentation.csproj -c Release -f net10.0 --no-build -o artifacts/dotnet-auto
          rm -f artifacts/dotnet-auto/*.pdb
          (cd artifacts/dotnet-auto && zip -qr "../wizelens-dotnet-auto-${GITHUB_REF_NAME#v}.zip" .)

      # NuGet before npm: a NuGet push can run again (--skip-duplicate), but npm never takes the same version twice.
      # The temporary key lasts one hour, so it is fetched right before the push. The policy is on nuget.org user bkorous.
      - name: NuGet login (OIDC to a temporary key)
        uses: NuGet/login@v1
        id: nuget
        with:
          user: bkorous

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Trusted publishing needs npm 11.5.1 or later; pnpm hands the upload to the npm on PATH.
      - name: Install an npm that can publish with OIDC
        run: npm install -g npm@^11.5.1

      # Every package under js/packages: lens-core, lens-node, lens-browser, lens-react, lens-vue, lens-angular, lens-svelte, lens-ui, lens-hub, lens-cloud, and lens-cli.
      # No token once each package trusts this repo and release.yml on npmjs.com. NPM_TOKEN is only for the very first publish, before the packages exist.
      - name: Publish to npm
        run: pnpm -r --filter "./js/packages/*" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/nuget/*.nupkg
            artifacts/npm/*.tgz
            artifacts/wizelens-dotnet-auto-*.zip
          generate_release_notes: true

  hub-image:
    name: Publish the hub, cloud, and inject images and the inject chart
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the hub and cloud images to ghcr.io/brandonkorous
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for NAME in hub cloud; do
            IMAGE="ghcr.io/brandonkorous/wizelens-$NAME"
            docker build -f "js/packages/$NAME/Dockerfile" -t "$IMAGE:$VERSION" .
            docker push "$IMAGE:$VERSION"
            if [[ "$VERSION" != *-* ]]; then docker tag "$IMAGE:$VERSION" "$IMAGE:latest" && docker push "$IMAGE:latest"; fi
          done

      - name: Build and push the inject image (the Kubernetes webhook and the no-code hooks it copies into pods)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/brandonkorous/wizelens-inject"
          docker build -f deploy/inject/Dockerfile -t "$IMAGE:$VERSION" .
          docker push "$IMAGE:$VERSION"
          if [[ "$VERSION" != *-* ]]; then docker tag "$IMAGE:$VERSION" "$IMAGE:latest" && docker push "$IMAGE:latest"; fi

      - name: Push the inject Helm chart to oci://ghcr.io/brandonkorous/charts
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package deploy/inject/chart --destination artifacts/chart
          helm push artifacts/chart/wizelens-inject-*.tgz oci://ghcr.io/brandonkorous/charts
