# Runs deploy/k8s/jobs/db-role.sql as the server admin. The deploy makes the `db-role-sql` ConfigMap from that file.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-role
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: psql
          image: postgres:18-alpine
          command: ["sh", "-c", 'psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -v app_password="$WIZELENS_APP_PASSWORD" -f /sql/db-role.sql']
          env:
            - name: DATABASE_ADMIN_URL
              valueFrom: { secretKeyRef: { name: db-admin, key: DATABASE_ADMIN_URL } }
            - name: WIZELENS_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: db-admin, key: WIZELENS_APP_PASSWORD } }
          volumeMounts: [{ name: sql, mountPath: /sql }]
      volumes:
        - name: sql
          configMap: { name: db-role-sql }
