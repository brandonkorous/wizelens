# WizeLens Cloud at app.wizelens.com.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud
spec:
  # One instance: migrations and background jobs (alerts, retention, settling) run inside the process.
  replicas: 1
  # Recreate, so two versions never migrate or send alerts at the same time.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: cloud } }
  template:
    metadata: { labels: { app: cloud } }
    spec:
      enableServiceLinks: false
      containers:
        - name: cloud
          image: wizelens/cloud:latest
          ports: [{ containerPort: 5970 }]
          envFrom:
            # DATABASE_URL, WIZELENS_CLOUD_AUTH_SECRET, WIZELENS_CLOUD_SETUP_TOKEN, optional SMTP.
            - secretRef: { name: cloud-env }
            - configMapRef: { name: cloud-config }
          # /healthz never touches the database; startup allows time for migrations at boot.
          startupProbe: { httpGet: { path: /healthz, port: 5970 }, periodSeconds: 5, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /healthz, port: 5970 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 5970 }, periodSeconds: 20 }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata:
  name: cloud
spec:
  selector: { app: cloud }
  ports: [{ port: 80, targetPort: 5970 }]
