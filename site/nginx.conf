# Serves the static export. Caddy in front adds TLS and the security headers.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript application/json image/svg+xml application/xml;

    # Behind a proxy: redirects keep the visitor's host and port.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed file names, so they never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The Markdown copies of the docs read as text, not as a download.
    location ~ \.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
